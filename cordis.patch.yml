# Ligui — a thin composition layer over @deepseek-ai/dsh-base.
#
# Every row here either overrides a row mounted by an earlier bundle or inserts
# a new one. A config override replaces the row's whole config, so restate any
# field you intend to keep.
#
# This file is both:
#   - the patch of the dsh-ligui bundle (`dsh plugin --profile ligui add .`)
#   - a standalone overlay (`dsh web --patch ./cordis.patch.yml`)

# ── Identity ────────────────────────────────────────────────────────────────

- id: system-prompt
  config:
    personaPrefix: >-
      Your deployment name is Ligui. You are a coding agent powered by the
      {{model}} model.
    personaSuffix: >-
      For GUI work — opening apps, navigating websites through their real
      interface, clicking, typing, or reading the screen — use the
      mcp__windows__ tools. Prefer Snapshot or Screenshot, then act with App,
      Click, Type, Shortcut, or Scroll, and verify the result. Do not use a
      headless browser for desktop tasks.

# ── Model routes ────────────────────────────────────────────────────────────
#
# dsh-base mounts @deepseek-ai/dsh-llm-pi-ai dormant. These routes activate its
# built-in catalog entries; endpoint, protocol, and model list come from the
# installed pi-ai catalog, so no URLs or model ids are repeated here.
#
# A route whose env var is unset still appears in the model picker; its
# requests fail with MISSING_CREDENTIAL until a key is supplied through the
# environment or Settings → Models (saved credentials outrank the env).
#
# The native DeepSeek route (deepseek-official) is mounted by dsh-base and
# reads DEEPSEEK_API_KEY; it is deliberately not duplicated here.

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
      google:
        apiKeyEnv: GEMINI_API_KEY
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
      moonshotai:
        apiKeyEnv: MOONSHOT_API_KEY
      zai:
        apiKeyEnv: ZAI_API_KEY
#
# More catalog routes are one entry away; these are key-based:
#   xai:       XAI_API_KEY
#   mistral:   MISTRAL_API_KEY
#   groq:      GROQ_API_KEY
#   cerebras:  CEREBRAS_API_KEY
#   together:  TOGETHER_API_KEY
#   fireworks: FIREWORKS_API_KEY

# ── Client theme ────────────────────────────────────────────────────────────
#
# The package is both the bundle and the browser plugin: the empty Node half
# gives the Loader a row, and dsh.client serves ./client.js to the Web UI.

- insert:
    - id: ligui-theme
      name: ./index.js

# ── Native Windows control ──────────────────────────────────────────────────
#
# Windows-MCP gives the model a real desktop: launch and switch applications,
# read the UI tree, click/type/scroll, take screenshots, and run PowerShell.
# It is an MCP server, so its tools arrive as mcp__windows__*.
#
# First-time setup on the machine:
#   uv tool install windows-mcp
#
# The desktop shell puts %USERPROFILE%\.local\bin on the server PATH; a plain
# CLI launch needs `windows-mcp` on PATH too.
#
# This is full desktop control, not a sandbox. The server keeps a user-takeover
# gate: moving the physical mouse or pressing Ctrl+Alt+Shift+Backspace returns
# control to the human. Review its security policy before enabling it for
# untrusted prompts.

- insert:
    - id: mcp-windows
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: windows
        transport: stdio
        command: windows-mcp
        args:
          - serve
          - --tools
          - 'Screenshot,Snapshot,Click,Type,Scroll,Move,Shortcut,App,Wait,WaitFor,DisplayInventory,ControlStatus,PowerShell,Process'
        env:
          WINDOWS_MCP_DISABLE_FLASH: '1'
          WINDOWS_MCP_SCREENSHOT_SCALE: '0.5'
        toolCallTimeoutMs: 120000
