# Ligui — a thin composition layer over @deepseek-ai/dsh-base.
#
# Every row here either overrides a row mounted by an earlier bundle or inserts
# a new one. A config override replaces the row's whole config, so restate any
# field you intend to keep.
#
# This file is both:
#   - the patch of the dsh-ligui bundle (`dsh plugin --profile ligui add .`)
#   - a standalone overlay (`dsh web --patch ./cordis.patch.yml`)

# ── Identity ────────────────────────────────────────────────────────────────

- id: system-prompt
  config:
    personaPrefix: >-
      Your deployment name is Ligui. You are a coding agent powered by the
      {{model}} model.
    personaSuffix: >-
      For GUI work, observe with the mcp__windows__ tools — Snapshot for the UI
      tree and element coordinates, Screenshot for pixels. Act with the native
      computer tool: key for scan-code chords, type for text, rawmove for
      relative mouse, move and click for absolute points, focus and launch for
      windows and apps. Focus the target, act, then verify with Snapshot or
      Screenshot. The computer tool uses the Interception driver; SendInput is
      only a fallback.
      For web work, use the dedicated mcp__browser__browser_* tools and keep
      their own browser untouched; use the native computer tool for desktop
      apps or OS-level input.
      You keep a persistent personal memory and skill library across projects.
      At the start of a task, search mcp__memory__search_nodes for the user and
      the project, and use relevant preferences. When you learn a durable
      preference, decision, or reusable approach, write it with
      mcp__memory__add_observations or mcp__memory__create_entities. Never
      store secrets, tokens, or passwords. When a solution is reusable, write
      a global skill under ~/.dsh/skills/<kebab-name>/SKILL.md with name,
      description, and whenToUse, then load it once with the skill tool to
      verify. Prefer updating an existing skill over duplicating it.

# ── Model routes ────────────────────────────────────────────────────────────
#
# dsh-base mounts @deepseek-ai/dsh-llm-pi-ai dormant. These routes activate its
# built-in catalog entries; endpoint, protocol, and model list come from the
# installed pi-ai catalog, so no URLs or model ids are repeated here.
#
# A route whose env var is unset still appears in the model picker; its
# requests fail with MISSING_CREDENTIAL until a key is supplied through the
# environment or Settings → Models (saved credentials outrank the env).
#
# The native DeepSeek route (deepseek-official) is mounted by dsh-base and
# reads DEEPSEEK_API_KEY; it is deliberately not duplicated here.

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
      google:
        apiKeyEnv: GEMINI_API_KEY
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
      moonshotai:
        apiKeyEnv: MOONSHOT_API_KEY
      zai:
        apiKeyEnv: ZAI_API_KEY
#
# More catalog routes are one entry away; these are key-based:
#   xai:       XAI_API_KEY
#   mistral:   MISTRAL_API_KEY
#   groq:      GROQ_API_KEY
#   cerebras:  CEREBRAS_API_KEY
#   together:  TOGETHER_API_KEY
#   fireworks: FIREWORKS_API_KEY

# ── Client theme ────────────────────────────────────────────────────────────
#
# The package is both the bundle and the browser plugin: the empty Node half
# gives the Loader a row, and dsh.client serves ./client.js to the Web UI.

- insert:
    - id: ligui-theme
      name: ./index.js

# ── Native Windows control ──────────────────────────────────────────────────
#
# Windows-MCP gives the model a real desktop: launch and switch applications,
# read the UI tree, click/type/scroll, take screenshots, and run PowerShell.
# It is an MCP server, so its tools arrive as mcp__windows__*.
#
# First-time setup on the machine:
#   uv tool install windows-mcp
#
# The desktop shell puts %USERPROFILE%\.local\bin on the server PATH; a plain
# CLI launch needs `windows-mcp` on PATH too.
#
# This is full desktop control, not a sandbox. The server keeps a user-takeover
# gate: moving the physical mouse or pressing Ctrl+Alt+Shift+Backspace returns
# control to the human. Review its security policy before enabling it for
# untrusted prompts.

- insert:
    - id: mcp-windows
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: windows
        transport: stdio
        command: windows-mcp
        args:
          - serve
          - --tools
          - 'Screenshot,Snapshot,Wait,WaitFor,DisplayInventory,ControlStatus'
        env:
          WINDOWS_MCP_DISABLE_FLASH: '1'
          WINDOWS_MCP_SCREENSHOT_SCALE: '0.5'
        toolCallTimeoutMs: 120000


# ── Dedicated browser ───────────────────────────────────────────────────────
#
# Playwright MCP owns a browser instance and a persistent profile under the
# Harness home. It prefers the newest Playwright Chromium on the machine and
# falls back to the installed Edge channel. The model sees
# mcp__browser__browser_* tools: navigate, snapshot, click, type, tabs,
# screenshot, console/network inspection, and file upload.

- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: stdio
        command: npx
        args: !!js "(() => { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const base = ['-y', '@playwright/mcp@0.0.80', '--user-data-dir', dshHomePath('ligui-browser'), '--viewport-size', '1440,900']; const root = path.join(process.env.LOCALAPPDATA || '', 'ms-playwright'); const dirs = fs.existsSync(root) ? fs.readdirSync(root).filter(d => d.startsWith('chromium-')).sort().reverse() : []; for (const d of dirs) { const exe = path.join(root, d, 'chrome-win64', 'chrome.exe'); if (fs.existsSync(exe)) return [...base, '--executable-path', exe]; } return [...base, '--browser', 'msedge']; })()"
        toolCallTimeoutMs: 120000

# ── Persistent memory ───────────────────────────────────────────────────────
#
# Local knowledge graph shared by every project. The model gets
# mcp__memory__create_entities, add_observations, create_relations,
# search_nodes, open_nodes, read_graph, and delete tools.

- insert:
    - id: mcp-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: stdio
        command: npx
        args:
          - '-y'
          - '@modelcontextprotocol/server-memory@2.0.1'
        env:
          MEMORY_FILE_PATH: !!js dshHomePath('ligui-memory.jsonl')
        toolCallTimeoutMs: 30000

# ── Branding ────────────────────────────────────────────────────────────────
# client.js fills the sidebar and hero brand slots with Ligui's ghost mark.
- id: ui-brand-official
  disabled: true
